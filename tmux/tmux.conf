# mouse support
set -g mouse on

# bigger scrollback history
set -g history-limit 1000000

# start window numbering from 1
set -g base-index 1
setw -g pane-base-index 1

# switch windows
bind -n C-h previous-window
bind -n C-l next-window

# change bar color
set -g status-style "bg=default,fg=white"

# focus events 
set-option -g focus-events on

# 12 hr clock
set -g status-right "#H %I:%M %p"

# add yellow highlight for active window marker
set -g window-status-current-format "#[fg=default]#I:#W#[fg=yellow]*#[default]"

# Set vi mode for copy mode key bindings (recommended for vim users)
setw -g mode-keys vi

# --- extended keys (needed for Ctrl+Tab and other modified keys in TUIs) ---
# tmux swallows the kitty keyboard protocol by default; this passes it through
# so apps like OpenCode can tell Ctrl+Tab apart from plain Tab.
set -s extended-keys on
set -s extended-keys-format csi-u
